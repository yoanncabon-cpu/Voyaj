<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Voyaj — Je suis bien rentré</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root { --primary: #4F46E5; --ok: #16A34A; --text: #12131A; --muted: #5E6275; --bg: #F7F7FB; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: var(--text); background: var(--bg); }
    header { padding: 16px; background: var(--primary); color: #fff; }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; opacity: .85; font-size: 14px; }
    #map { height: calc(100vh - 150px); min-height: 320px; }
    #status { padding: 14px 16px; font-size: 15px; background: #fff; border-top: 1px solid #E3E5EE; }
    .ok { color: var(--ok); font-weight: 700; }
    .muted { color: var(--muted); }
    .big { display: flex; align-items: center; justify-content: center; height: calc(100vh - 150px); flex-direction: column; text-align: center; padding: 24px; }
    .big div { font-size: 64px; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Suivi du retour</h1>
    <p>Partagé via l'application Voyaj</p>
  </header>
  <div id="map"></div>
  <div id="status" class="muted">Chargement…</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    // URL des Edge Functions Supabase du projet Voyaj (à renseigner au déploiement).
    const FUNCTIONS_URL = 'https://REMPLACER.supabase.co/functions/v1';
    const token = new URLSearchParams(location.search).get('t') || '';
    const statusEl = document.getElementById('status');
    const titleEl = document.getElementById('title');
    let map, marker;

    function showMessage(emoji, text) {
      document.getElementById('map').outerHTML = '<div class="big"><div>' + emoji + '</div><p>' + text + '</p></div>';
    }

    async function refresh() {
      try {
        const r = await fetch(FUNCTIONS_URL + '/safe-return-public?t=' + encodeURIComponent(token), { cache: 'no-store' });
        if (!r.ok) { showMessage('🔗', 'Lien invalide ou expiré.'); statusEl.textContent = ''; return false; }
        const d = await r.json();
        titleEl.textContent = d.name + ' rentre';
        if (d.status === 'arrived') {
          titleEl.textContent = d.name + ' est bien arrivé·e';
          showMessage('✅', d.name + ' a confirmé être bien arrivé·e.');
          statusEl.innerHTML = '<span class="ok">Arrivé·e</span>';
          return false;
        }
        if (d.status === 'expired') {
          showMessage('⏱️', 'Ce suivi est terminé.');
          statusEl.textContent = '';
          return false;
        }
        if (d.lat != null && d.lng != null) {
          const pos = [d.lat, d.lng];
          if (!map) {
            map = L.map('map').setView(pos, 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              maxZoom: 19, attribution: '&copy; OpenStreetMap',
            }).addTo(map);
            marker = L.marker(pos).addTo(map);
          } else {
            marker.setLatLng(pos);
            map.panTo(pos);
          }
        }
        const updated = new Date(d.updatedAt).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        statusEl.innerHTML = 'Position mise à jour à ' + updated + ' · actualisation automatique';
        return true;
      } catch (e) {
        statusEl.textContent = 'Connexion impossible, nouvel essai…';
        return true;
      }
    }

    (async function loop() {
      if (!token) { showMessage('🔗', 'Lien incomplet.'); statusEl.textContent = ''; return; }
      if (await refresh()) setTimeout(loop, 20000);
    })();
  </script>
</body>
</html>
