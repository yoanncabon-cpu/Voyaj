name: CI

# Vérifications à chaque push : aucune build ni déploiement ici
# (les builds iOS/Android passent par EAS, comme l'app paroisse).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  supabase-functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check */index.ts _shared/*.ts
      - run: deno lint
      - run: deno test _shared/

  app:
    name: App Expo (TypeScript + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
