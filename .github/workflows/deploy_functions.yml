name: Deploy Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase/firestore.rules'
      - 'firebase/storage.rules'
      - 'firebase/firestore.indexes.json'
      - '.github/workflows/deploy_functions.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Firebase environment'
        required: true
        default: 'staging'
        type: choice
        options: [dev, staging, prod]

jobs:
  deploy:
    name: Deploy to Firebase (${{ github.event.inputs.environment || 'staging' }})
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Build Functions
        working-directory: functions
        run: |
          npm ci
          npm run build

      - name: Set Stripe secret key
        run: |
          firebase functions:secrets:set STRIPE_SECRET_KEY \
            --data-binary "${{ secrets.STRIPE_SECRET_KEY }}" \
            --project "${{ env.FIREBASE_PROJECT }}"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT: ${{ github.event.inputs.environment == 'prod' && 'voyaj-prod' || 'voyaj-staging' }}
        continue-on-error: true

      - name: Deploy Firestore rules & indexes
        run: |
          firebase deploy --only firestore \
            --project "${{ env.FIREBASE_PROJECT }}" \
            --token "${{ secrets.FIREBASE_TOKEN }}"
        env:
          FIREBASE_PROJECT: ${{ github.event.inputs.environment == 'prod' && 'voyaj-prod' || 'voyaj-staging' }}

      - name: Deploy Storage rules
        run: |
          firebase deploy --only storage \
            --project "${{ env.FIREBASE_PROJECT }}" \
            --token "${{ secrets.FIREBASE_TOKEN }}"
        env:
          FIREBASE_PROJECT: ${{ github.event.inputs.environment == 'prod' && 'voyaj-prod' || 'voyaj-staging' }}

      - name: Deploy Functions
        run: |
          firebase deploy --only functions \
            --project "${{ env.FIREBASE_PROJECT }}" \
            --token "${{ secrets.FIREBASE_TOKEN }}"
        env:
          FIREBASE_PROJECT: ${{ github.event.inputs.environment == 'prod' && 'voyaj-prod' || 'voyaj-staging' }}
