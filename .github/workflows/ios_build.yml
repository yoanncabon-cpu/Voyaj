name: iOS Build & TestFlight

on:
  push:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - '.github/workflows/ios_build.yml'
  workflow_dispatch:

# Secrets requis (Settings → Secrets and variables → Actions) :
#   APPLE_TEAM_ID                         — Team ID Apple Developer (10 caractères)
#   IOS_P12_BASE64 / IOS_P12_PASSWORD     — certificat "Apple Distribution" exporté en .p12
#   IOS_PROVISIONING_PROFILE_BASE64       — profil "App Store" pour com.voyaj.app
#   GOOGLE_SERVICE_INFO_PLIST_PROD_BASE64 — GoogleService-Info.plist du projet voyaj-prod
#   APPSTORE_ISSUER_ID / APPSTORE_API_KEY_ID / APPSTORE_API_PRIVATE_KEY — clé API App Store Connect

jobs:
  build-ios:
    name: Build iOS IPA & Upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Install Apple certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}

      - name: Install provisioning profile & configure signing
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/voyaj.mobileprovision"
          echo "$PROFILE_B64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist")
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision

          # Signature manuelle de la cible Runner (Release)
          PBX=ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g" $PBX
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com.voyaj.app;/PRODUCT_BUNDLE_IDENTIFIER = com.voyaj.app; DEVELOPMENT_TEAM = $TEAM_ID; CODE_SIGN_IDENTITY = \"Apple Distribution\"; PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";/g" $PBX

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.voyaj.app</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Write GoogleService-Info.plist (prod)
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_INFO_PLIST_PROD_BASE64 }}' | base64 --decode \
            > ios/Runner/GoogleService-Info.plist

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update

      - name: Build IPA
        run: |
          flutter build ipa --release \
            --build-number=${{ github.run_number }} \
            --export-options-plist=ios/ExportOptions.plist
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          echo "IPA_PATH=mobile/$IPA" >> $GITHUB_ENV

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: mobile/build/ios/ipa/*.ipa
          retention-days: 7

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
