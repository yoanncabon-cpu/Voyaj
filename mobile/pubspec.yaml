name: voyaj
description: "Covoiturage et autostop connecté"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ---- State management & navigation ----
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.7

  # ---- Models ----
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ---- Firebase ----
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  firebase_remote_config: ^5.1.3
  firebase_crashlytics: ^4.1.3
  firebase_app_check: ^0.3.1+3
  firebase_analytics: ^11.3.3
  cloud_functions: ^5.1.3

  # ---- Géolocalisation & cartes ----
  geolocator: ^13.0.1
  geoflutterfire_plus: ^0.0.30
  mapbox_maps_flutter: ^2.4.0
  latlong2: ^0.9.0
  flutter_map: ^7.0.2

  # ---- Paiement ----
  flutter_stripe: ^10.2.0

  # ---- Biométrie & sécurité ----
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # ---- Caméra, photos, scan ----
  image_picker: ^1.1.2
  mobile_scanner: ^5.2.3
  cached_network_image: ^3.4.1

  # ---- Notifications & foreground service ----
  flutter_local_notifications: ^17.2.2
  flutter_foreground_task: ^8.10.0

  # ---- Appels WebRTC ----
  flutter_webrtc: ^0.11.3
  flutter_callkit_incoming: ^2.0.0+1

  # ---- Communication ----
  share_plus: ^10.0.2
  url_launcher: ^6.3.1
  app_links: ^6.3.3

  # ---- Utilitaires ----
  intl: ^0.19.0
  equatable: ^2.0.5
  dio: ^5.7.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.5
  battery_plus: ^6.0.1
  flutter_svg: ^2.0.10+1
  qr_flutter: ^4.1.0

  # ---- UI ----
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  pinput: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  riverpod_lint: ^2.3.13
  custom_lint: ^0.6.7
  mocktail: ^1.0.4
  patrol: ^3.10.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
