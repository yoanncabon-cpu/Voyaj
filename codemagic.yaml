# Codemagic — build iOS dans le cloud + envoi TestFlight (équivalent EAS pour Flutter)
# Signature automatique : Codemagic crée/récupère le certificat et le profil
# via la clé App Store Connect (même clé que l'app de la paroisse).
#
# Pré-requis dans Codemagic (Team settings → Integrations → Developer Portal) :
#   clé App Store Connect nommée "voyaj_asc" (fichier AuthKey_XXXX.p8 + Key ID + Issuer ID)

workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: mobile
    integrations:
      app_store_connect: voyaj_asc
    environment:
      flutter: 3.27.4
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.voyaj.app
      vars:
        BUNDLE_ID: com.voyaj.app
        # ID numérique de l'app dans App Store Connect (Infos de l'app → Apple ID), à remplir
        APP_STORE_APPLE_ID: 0
    triggering:
      events: [push]
      branch_patterns:
        - pattern: main
    scripts:
      - name: Dépendances Flutter
        script: flutter pub get
      - name: Génération de code (freezed / riverpod / json)
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Analyse
        script: flutter analyze --no-fatal-infos
      - name: Tests
        script: flutter test
      - name: CocoaPods
        script: cd ios && pod install --repo-update
      - name: Profils de signature
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          # Numéro de build = dernier numéro TestFlight + 1
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          flutter build ipa --release \
            --build-number=$((LATEST + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
